name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanity:
    name: Sanity Tests
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment: QA

    env:
      BASE_URL: ${{ vars.QA_BASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Sanity tests
        run: npx playwright test --grep @sanity --project=chromium

      - name: Upload Sanity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanity-evidence-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  regression:
    name: Regression Tests
    needs: sanity
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: QA

    env:
      BASE_URL: ${{ vars.QA_BASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Regression tests
        run: npx playwright test --grep @regression --project=chromium

      - name: Upload Regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-evidence-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
