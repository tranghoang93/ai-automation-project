name: Playwright QA Tests


on:
 push:
   branches: [main, master]


 pull_request:
   branches: [main, master]


 workflow_dispatch:
   inputs:
     target_environment:
       description: Environment to test
       required: true
       type: choice
       options:
         - QA
         - Staging
         - UAT


     suite:
       description: Test suite to execute
       required: true
       type: choice
       options:
         - story
         - regression
         - sanity


permissions:
 contents: read


jobs:
 test:
   name: Run QA Tests
   runs-on: ubuntu-latest
   timeout-minutes: 60


   # Keep the existing GitHub environment named Test-QA.
   # Map the QA dropdown option to Test-QA.
   environment:
     name: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment == 'QA' && 'Test-QA' || (github.event_name == 'workflow_dispatch' && inputs.target_environment || 'Test-QA') }}


   env:
     TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'QA' }}
     BASE_URL: ${{ vars.BASE_URL }}


   steps:
     - name: Validate environment and suite
       if: github.event_name == 'workflow_dispatch'
       env:
         SELECTED_ENV: ${{ inputs.target_environment }}
         SUITE: ${{ inputs.suite }}
       run: |
         case "SELECTEDENV:SUITE" in
           QA:story|Staging:regression|UAT:sanity)
             echo "Running $SUITE tests on $SELECTED_ENV"
             ;;
           *)
             echo "Invalid environment and suite combination."
             echo "QA requires story; Staging requires regression; UAT requires sanity."
             exit 1
             ;;
         esac


     - uses: actions/checkout@v4


     - uses: actions/setup-node@v4
       with:
         node-version: lts/*
         cache: npm


     - name: Install dependencies
       run: npm ci


     - name: Install Playwright Chromium
       run: npx playwright install --with-deps chromium


     - name: Verify target configuration
       run: |
         node -e "
           const url = process.env.BASE_URL;
           if (!url) {
             console.error('BASE_URL is missing for ' + process.env.TARGET_ENV);
             process.exit(1);
           }
           const parsed = new URL(url);
           if (parsed.protocol !== 'https:') {
             console.error('Target URL must use HTTPS');
             process.exit(1);
           }
           console.log('Target environment:', process.env.TARGET_ENV);
           console.log('Target hostname:', parsed.hostname);
         "


     - name: Run Story Tests
       if: github.event_name != 'workflow_dispatch'
       run: npx playwright test --grep "@story" --project=chromium


     - name: Run Selected Suite
       if: github.event_name == 'workflow_dispatch'
       env:
         SUITE: ${{ inputs.suite }}
       run: npx playwright test --grep "@${SUITE}" --project=chromium


     - name: Upload Playwright Evidence
       if: always()
       uses: actions/upload-artifact@v4
       with:
         name: qa-evidence-${{ github.run_id }}
         path: |
           playwright-report/
           test-results/
         if-no-files-found: ignore
         retention-days: 14
